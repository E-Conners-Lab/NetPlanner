# NetPlanner backend — managed by uv.
# Dependencies pinned to exact versions (SEC-30); bump deliberately and
# review changelogs. `uv.lock` is the committed source of truth — regenerate
# with `uv lock` after editing this file.

[project]
name = "netplanner-backend"
version = "0.1.0"
description = "NetPlanner backend — AI-powered network business decision-support."
requires-python = ">=3.12"
dependencies = [
    # --- Web framework ---
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.0",
    # Pinned >=1.0.1 to fix PYSEC-2026-161 (DoS via Content-Type header in
    # MultiPartParser). 1.3.1 fixes GHSA-82w8-qh3p-5jfq (form() limit DoS) and
    # GHSA-jp82-jpqv-5vv3 (host poisoning). fastapi 0.136.3 requires
    # starlette>=0.46.0 (no upper bound), so 1.3.1 is compatible.
    "starlette==1.3.1",
    # --- Database (async SQLite) ---
    "SQLAlchemy==2.0.49",
    "aiosqlite==0.22.1",
    "alembic==1.18.5",
    "greenlet==3.5.4",
    # --- Validation / settings ---
    "pydantic==2.13.4",
    # 2.14.2 fixes GHSA-4xgf-cpjx-pc3j (NestedSecretsSettingsSource symlink
    # escape). Not reachable here (env_file only, no secrets_dir) but patched.
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    # --- AI layer ---
    "anthropic==0.120.2",
    # Provider-agnostic routing for the multi-provider eval (NVIDIA NIM via the
    # `nvidia_nim/` provider). The default path stays native Anthropic; LiteLLM
    # is only exercised when `provider=nvidia_nim`. Pinned exact (SEC-30).
    "litellm==1.94.1",
    # --- PDF generation ---
    "weasyprint==69.0",
    "markdown==3.10.3",
    # Whitelist-based HTML sanitizer for Advisor-authored markdown rendered
    # into PDF reports (defends against <script>, javascript:, file://, etc.).
    "bleach==6.4.0",
    # --- Authentication (SEC-01 / SEC-17) ----------------------------------
    # Argon2id password hashing (SEC-17, OWASP 2026 baseline).
    "argon2-cffi==25.1.0",
    # JWT signing for the BFF httpOnly session cookie (SEC-01).
    # 2.13.0 fixes PYSEC-2026-175..179 (pip-audit / SEC-29).
    "PyJWT==2.13.0",
    # --- Rate limiting / DoS controls (SEC-06) -----------------------------
    "slowapi==0.1.10",
]

# Dev-only tooling: testing, linting, formatting, type checking, security
# scanning. Installed by `uv sync`, excluded by `uv sync --no-dev`.
[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.16.1",
    "black==26.5.1",
    "isort==8.0.1",
    "mypy==2.3.0",
    "bandit==1.9.4",
]

[tool.uv]
# NetPlanner backend is an application, not an installable library — the
# `app` package is imported via pytest's `pythonpath`, not pip-installed.
package = false

# Folded in from the former pytest.ini.
[tool.pytest.ini_options]
# `asyncio_mode = auto` lets async test functions run without per-test markers.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Make the `app` package importable when running `pytest backend/tests/`.
pythonpath = "."
testpaths = ["tests"]
