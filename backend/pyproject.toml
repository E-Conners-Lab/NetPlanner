# NetPlanner backend — managed by uv.
# Dependencies pinned to exact versions (SEC-30); bump deliberately and
# review changelogs. `uv.lock` is the committed source of truth — regenerate
# with `uv lock` after editing this file.

[project]
name = "netplanner-backend"
version = "0.1.0"
description = "NetPlanner backend — AI-powered network business decision-support."
requires-python = ">=3.12"
dependencies = [
    # --- Web framework ---
    "fastapi==0.136.3",
    "uvicorn[standard]==0.48.0",
    # --- Database (async SQLite) ---
    "SQLAlchemy==2.0.49",
    "aiosqlite==0.22.1",
    "alembic==1.18.4",
    "greenlet==3.5.1",
    # --- Validation / settings ---
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "python-dotenv==1.2.2",
    # --- AI layer ---
    "anthropic==0.104.1",
    # --- PDF generation ---
    "weasyprint==68.1",
    "markdown==3.10.2",
]

# Dev-only tooling: testing, linting, formatting, type checking, security
# scanning. Installed by `uv sync`, excluded by `uv sync --no-dev`.
[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.15.14",
    "black==26.5.1",
    "isort==8.0.1",
    "mypy==2.1.0",
    "bandit==1.9.4",
]

[tool.uv]
# NetPlanner backend is an application, not an installable library — the
# `app` package is imported via pytest's `pythonpath`, not pip-installed.
package = false

# Folded in from the former pytest.ini.
[tool.pytest.ini_options]
# `asyncio_mode = auto` lets async test functions run without per-test markers.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Make the `app` package importable when running `pytest backend/tests/`.
pythonpath = "."
testpaths = ["tests"]
