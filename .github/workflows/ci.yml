name: CI

# Runs the project quality gate on every push to main and every PR.
# Backend, frontend, and security scans are all hard-blocking
# (SEC-29 dependencies + SEC-35 SAST and secret scanning).
#
# The backend is managed by uv: `uv.lock` is the committed source of truth and
# `uv sync --frozen` installs exactly what it pins (fails if it drifts).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege — CI only needs to read the repository (SEC-32).
permissions:
  contents: read

jobs:
  backend:
    name: Backend gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install WeasyPrint native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check app tests alembic

      - name: Black (formatting)
        run: uv run black --check app tests alembic

      - name: isort (import order)
        run: uv run isort --check-only app tests alembic

      - name: Mypy (type check)
        run: uv run mypy app --ignore-missing-imports

      - name: Bandit (security static analysis)
        run: uv run bandit -r app alembic -ll

      - name: Migrations apply and match the ORM
        env:
          JWT_SECRET: ci-jwt-secret-for-test-only
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Tests + coverage (80% floor)
        env:
          JWT_SECRET: ci-jwt-secret-for-test-only
          SESSION_COOKIE_SECURE: "false"
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  frontend:
    name: Frontend gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build

      # --- E2E: drive the real UI against the full stack ------------------
      # The build above only proves the app compiles. Playwright boots the
      # backend (FastAPI) + frontend (Vite) and exercises every core flow so a
      # runtime regression — e.g. from a dependency bump — blocks the merge.
      - name: Install uv (for the E2E backend)
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install WeasyPrint native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info

      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E
        env:
          CI: "true"
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: pip-audit (Python dependency vulnerabilities — SEC-29)
        run: |
          uv export --project backend --no-emit-project --all-groups \
            --format requirements-txt -o /tmp/np-requirements.txt
          uvx pip-audit --disable-pip -r /tmp/np-requirements.txt

      - name: npm audit (frontend dependency vulnerabilities — SEC-29)
        working-directory: frontend
        run: npm audit --audit-level=moderate

      - name: Semgrep (SAST — SEC-35)
        run: uvx semgrep scan --config=auto --error

      - name: TruffleHog (secret scanning — SEC-35)
        # Native push protection is paid on private repos; this is the CI
        # equivalent. Filesystem scan of the checked-out tree — no git
        # base/head range, so it works on any push.
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin
          trufflehog filesystem . --only-verified --fail
