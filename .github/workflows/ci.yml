name: CI

# Runs the project quality gate on every push to main and every PR.
# The backend and frontend gates are hard checks. The security scans start
# informational (continue-on-error) so they surface findings without blocking
# a freshly-introduced baseline — remove `continue-on-error` to make them gate
# merges per SEC-29 (dependencies) and SEC-35 (SAST + secret scanning).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege — CI only needs to read the repository (SEC-32).
permissions:
  contents: read

jobs:
  backend:
    name: Backend gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install WeasyPrint native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check app tests alembic

      - name: Black (formatting)
        run: black --check app tests alembic

      - name: isort (import order)
        run: isort --check-only app tests alembic

      - name: Mypy (type check)
        run: mypy app --ignore-missing-imports

      - name: Bandit (security static analysis)
        run: bandit -r app alembic -ll

      - name: Migrations apply and match the ORM
        run: |
          alembic upgrade head
          alembic check

      - name: Tests + coverage (80% floor)
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  frontend:
    name: Frontend gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: pip-audit (Python dependency vulnerabilities — SEC-29)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: npm audit (frontend dependency vulnerabilities — SEC-29)
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Semgrep (SAST — SEC-35)
        continue-on-error: true
        run: |
          pip install semgrep
          semgrep scan --config=auto --error

      - name: TruffleHog (secret scanning — SEC-35)
        # Native push protection is paid on private repos; this is the CI
        # equivalent. Filesystem scan of the checked-out tree — no git
        # base/head range, so it works on any push.
        continue-on-error: true
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin
          trufflehog filesystem . --only-verified --fail
