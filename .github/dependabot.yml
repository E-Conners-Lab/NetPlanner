version: 2

# Tames Dependabot. Routine minor/patch bumps are grouped into a single PR
# per ecosystem (instead of one PR per package), and major build-tooling
# upgrades are deferred to a deliberate, tested decision rather than an
# auto-opened PR.
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # vite 8 is a Rolldown-based rewrite and @vitejs/plugin-react majors
      # must be matched to it — major build-tooling upgrades are done by
      # hand, not by auto-PR.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]

  # Backend is uv-managed — Dependabot reads pyproject.toml + uv.lock.
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
